name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AWS_REGION: eu-west-1
  ENVIRONMENT: staging

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --select F .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - customers
          - accounts
          - transactions
          - fraud
          - cards
          - loans
          - ledger
          - notification
          - audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r services/${{ matrix.service }}/requirements.txt
      - run: python -m pytest -q
        working-directory: services/${{ matrix.service }}

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint helm/northbank-chart

  build-push:
    needs: [lint, test, helm-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - customers
          - accounts
          - transactions
          - fraud
          - cards
          - loans
          - ledger
          - notification
          - audit
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/northbank-${{ env.ENVIRONMENT }}-${{ matrix.service }}"
          docker build -f Docker/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
