{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: northbank
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/part-of: northbank
    spec:
      securityContext:
        fsGroup: 10001
              {{- if $svc.redis }}
      initContainers:
        - name: wait-for-redis
          image: {{ $.Values.redis.image }}
          command:
            - sh
            - -c
            - until redis-cli -h redis -p {{ $.Values.redis.port }} ping; do echo waiting for redis; sleep 2; done
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.namePrefix }}{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ $.Values.secretName }}
          env:
            - name: DATABASE_URL
              value: "sqlite:////data/{{ $name }}.db"
            {{- if $svc.redis }}
            - name: REDIS_URL
              value: "redis://redis:{{ $.Values.redis.port }}/0"
            {{- end }}
            {{- range $k, $v := $.Values.config }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
{{- end }}
