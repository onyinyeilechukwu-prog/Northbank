# Single front door. Hostnames (auth, accounts, ...) are the Compose service names / k8s Service names.
# NOT exposed on purpose: fraud and audit (internal-only), and every /internal/* path of every service.
events {}
http {
  server {
    listen 80;
    location /internal/      { return 404; }   # belt and braces: internal endpoints never leave the cluster
    location /auth/          { proxy_pass http://auth:8000/;          proxy_set_header Host $host; }
    location /customers      { proxy_pass http://customers:8000;      proxy_set_header Host $host; }
    location /accounts       { proxy_pass http://accounts:8000;       proxy_set_header Host $host; }
    location /transfers      { proxy_pass http://transactions:8000;   proxy_set_header Host $host; }
    location /cards          { proxy_pass http://cards:8000;          proxy_set_header Host $host; }
    location /loans          { proxy_pass http://loans:8000;          proxy_set_header Host $host; }
    location /ledger         { proxy_pass http://ledger:8000;         proxy_set_header Host $host; }
    location /notifications  { proxy_pass http://notification:8000;   proxy_set_header Host $host; }
    location = /healthz      { return 200 "ok\n"; }
  }
}
